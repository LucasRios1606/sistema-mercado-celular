name: Gerar APK de teste

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: Compilar aplicativo Android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar o Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar as ferramentas do Android
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Compilar o APK de teste
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Disponibilizar o APK para baixar
        uses: actions/upload-artifact@v7
        with:
          name: mercado-apk-teste
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
